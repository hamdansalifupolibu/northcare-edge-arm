# NorthCare API — Railway hosted sandbox (hackathon demo backend).
# Honesty: NORTHCARE_ENV=development + AT sandbox only — not live telecom / production.
#
# Prerequisites (once):
#   railway login
#   cd services/api
#   railway init
#   railway add --database postgres
#   # Set variables (see docs/development/REACH_HOSTED_SANDBOX_DEPLOY.md)
#   railway up

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath = "/health/live"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
