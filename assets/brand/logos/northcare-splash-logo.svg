<?xml version="1.0" encoding="UTF-8"?>
<svg class="w-full h-full" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
<defs>
<linearGradient id="brandGradient" x1="0%" x2="100%" y1="0%" y2="100%">
<stop offset="0%" style="stop-color:#0f766e;stop-opacity:1"></stop>
<stop offset="100%" style="stop-color:#064e49;stop-opacity:1"></stop>
</linearGradient>
<style>
      .logo-path {
        stroke-dasharray: 1000;
        stroke-dashoffset: 1000;
        animation: draw 3s ease-in-out forwards;
        fill: none;
        stroke: url(#brandGradient);
        stroke-width: 2;
      }
      
      .logo-fill {
        opacity: 0;
        animation: fadeInFill 1s ease-in-out 2s forwards;
      }
      
      .amber-curve {
        opacity: 0;
        transform: scale(0.8);
        animation: sweepIn 1.5s ease-out 1.5s forwards;
      }

      .logo-container {
        animation: pulse 4s ease-in-out infinite 3.5s;
        transform-origin: center;
      }

      @keyframes draw {
        to { stroke-dashoffset: 0; }
      }

      @keyframes fadeInFill {
        from { opacity: 0; }
        to { opacity: 1; }
      }

      @keyframes sweepIn {
        from { opacity: 0; transform: scale(0.8) rotate(-20deg); }
        to { opacity: 1; transform: scale(1) rotate(0deg); }
      }

      @keyframes pulse {
        0%, 100% { transform: scale(1); filter: drop-shadow(0 0 0px rgba(15, 118, 110, 0)); }
        50% { transform: scale(1.03); filter: drop-shadow(0 0 15px rgba(15, 118, 110, 0.2)); }
      }
    </style>
</defs>
<g class="logo-container">
<!-- Silhouette of Northern Ghana / Shield Shape -->
<path class="logo-path" d="M200,50 C120,50 80,100 80,180 C80,280 150,330 200,350 C250,330 320,280 320,180 C320,100 280,50 200,50 Z"></path>
<path class="logo-fill" d="M200,50 C120,50 80,100 80,180 C80,280 150,330 200,350 C250,330 320,280 320,180 C320,100 280,50 200,50 Z" fill="url(#brandGradient)"></path>
<!-- Mother and Child Silhouette (Stylized) -->
<g class="logo-fill">
<path d="M190,120 C160,120 140,150 140,180 C140,230 180,260 210,260 C230,260 250,240 250,210 C250,180 230,120 190,120 Z M210,210 C200,210 190,200 190,190 C190,180 200,170 210,170 C220,170 230,180 230,190 C230,200 220,210 210,210 Z" fill="white"></path>
</g>
<!-- Amber Path / Curve -->
<path class="amber-curve" d="M260,280 C290,250 310,210 310,170 C310,130 290,100 260,80 L270,100 C295,120 300,150 300,175 C300,200 295,230 270,260 Z" fill="#F59E0B"></path>
</g>
</svg>
